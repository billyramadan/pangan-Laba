# Salin konfigurasi yang diperlukan ke secrets.toml dan isi nilai milik pengelola.
# Saat deploy, simpan rahasia di variabel lingkungan hosting; nilainya mengesampingkan file ini.
# Lihat docs/TRIAL_SUBSCRIPTION.md untuk daftar nama variabel deploy.
[auth]
redirect_uri = "http://127.0.0.1:8000/auth/callback"
cookie_secret = "GANTI_DENGAN_RANDOM_SECRET_PANJANG"

[auth.google]
client_id = "GANTI_DENGAN_CLIENT_ID"
client_secret = "GANTI_DENGAN_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[admin]
# Daftar email Google yang boleh mengunggah data, melatih model, dan melihat evaluasi.
emails = ["email-pengelola@example.com"]

[billing]
plan_name = "PanganLaba Bulanan"
price_idr = 0 # Isi nominal yang sudah diputuskan oleh pengelola.
duration_days = 30
# Provider pembayaran online: "manual" (transfer BCA + verifikasi admin),
# "xendit" (VA/QRIS/e-wallet), atau "stripe" (checkout kartu/metode Stripe).
provider = "manual"
# --- Jika provider = "xendit", isi kunci dari dashboard Xendit (Settings -> API Keys).
# xendit_api_key = "xnd_development_..."
# Wajib: token callback yang disetel di dashboard Xendit untuk endpoint /api/webhook/xendit.
# xendit_webhook_token = "GANTI_DENGAN_TOKEN_CALLBACK_XENDIT"
# --- Jika provider = "stripe", isi kunci dari dashboard Stripe.
# stripe_api_key = "sk_test_..."
# stripe_webhook_secret = "whsec_..." # dari Stripe Dashboard -> Webhooks
# stripe_mode = "subscription" # "subscription" (auto-renew bulanan, default) atau "payment" (one-time)
# # Opsional: paksa pakai id Price yang sudah ada, bukan buat otomatis.
# stripe_price_map = { starter = "price_...", pro = "price_...", enterprise = "price_..." }
# --- Fallback manual (dipakai saat provider = "manual").
bank_name = "BCA"
bank_number = "" # Isi hanya dengan rekening usaha yang sudah diverifikasi.
bank_account_name = "PanganLaba"
checkout_urls = { starter = "", pro = "", enterprise = "" } # Hosted payment link nyata per paket (opsional).
payment_instructions = "" # Atau isi instruksi transfer manual; jangan masukkan rahasia API di sini.
support_url = "" # Opsional: URL WhatsApp/email bantuan pengelola.
support_label = "Hubungi pengelola"
